# Jobs from any project that use this serial-group string take turns
# on the shared device pool.
version: 2.1

jobs:
  build:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run: ./scripts/build.sh
  device-tests:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run: ./scripts/run-device-tests.sh

workflows:
  main-workflow:
    jobs:
      - build
      - device-tests:
          serial-group: test-resources/device-pool
          requires:
            - build
