# The serial-group key on the group invocation holds the lock until
# every job in the group has finished.
version: 2.1

jobs:
  build:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run: ./scripts/build.sh
  migrate:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run: ./scripts/migrate.sh
  verify:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run: ./scripts/verify.sh
  notify:
    docker:
      - image: cimg/base:current
    steps:
      - run: echo "Migration complete"

job-groups:
  migrate-and-verify:
    jobs:
      - migrate
      - verify:
          requires:
            - migrate

workflows:
  main-workflow:
    jobs:
      - build
      - migrate-and-verify:
          serial-group: shared-db/migrations
          requires:
            - build
      - notify:
          requires:
            - migrate-and-verify
