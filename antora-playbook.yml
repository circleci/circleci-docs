site:
  title: CircleCI Docs
  url: https://circleci.com/docs
  robots: |
    User-agent: *
    Allow: /

    Sitemap: https://circleci.com/docs/sitemap.xml

    # llms.txt - Structured documentation for AI/LLM consumption
    # See https://circleci.com/docs/llms.txt for machine-readable documentation
  keys:
    cookiebot: a28b71f3-4d2e-4eac-93bc-34929948dd7d
    google_analytics: 'GTM-W9HDVK'
runtime:
  log:
    format: pretty
content:
  # Only build the current checkout. Without this, Antora falls back to its
  # default branch filter (which includes the `v{0..9}*` glob) and pulls in
  # any remote branch whose name matches (e.g. `v3-api-docs-link`), causing
  # duplicate-page and missing-object build failures.
  branches: HEAD
  sources:
  - url: .
    start_path: docs/root
  - url: .
    start_path: docs/guides
  - url: .
    start_path: docs/reference
  - url: .
    start_path: docs/orbs
  - url: .
    start_path: docs/server-admin-4.10
  - url: .
    start_path: docs/server-admin-4.9
  - url: .
    start_path: docs/server-admin-4.8
  - url: .
    start_path: docs/server-admin-4.7
  - url: .
    start_path: docs/services
  - url: .
    start_path: docs/contributors
ui:
  bundle:
    url: ./ui-bundle.zip
output:
  dir: ./build
  clean: true
  destinations:
  - provider: fs
asciidoc:
  attributes:
    source-highlighter: shiki
    serverversion4: 4.0.6
    serverversion41: 4.1.10
    serverversion42: 4.2.7
    serverversion43: 4.3.9
    serverversion44: 4.4.7
    serverversion45: 4.5.5
    serverversion46: 4.6.6
    serverversion47: 4.7.15
    serverversion48: 4.8.12
    serverversion49: 4.9.5
    serverversion410: 4.10.0
    terraformversion: 0.15.4
    dockerversion: v28
    kubectlversion: 1.19
    helmversion: 3.9.2
    helmdiffversion: 3.5.0
    kotsversion: 1.65.0
    xcodeversion: 27.0.0
    page-toclevels: 6
    idprefix: ""
    idseparator: "-"
  extensions:
  - '@asciidoctor/tabs'
  - ./extensions/theme-icon-extension.js
  - ./extensions/subsection-badge-extension.js
  - ./extensions/page-availability-extension.js
urls:
  latest_version_segment: latest
  latest_version_segment_strategy: redirect:to
  html_extension_style: indexify
antora:
  extensions:
  - require: 'antora-shiki-extension'
    theme: dracula
    languages:
      - asciidoc
      - bash
      - c
      - clojure
      - diff
      - docker
      - go
      - groovy
      - hcl
      - java
      - javascript
      - json
      - kotlin
      - make
      - markdown
      - powershell
      - python
      - ruby
      - rust
      - shellscript
      - shellsession
      - sql
      - typescript
      - xml
      - yaml
      - rst
  - require: ./extensions/unlisted-pages-extension.js
    allowedUnlistedPages:
      - 'deploy:deploy-to-pypi-registry.adoc'
  - require: '@sntke/antora-mermaid-extension'
    mermaid_initialize_options:
      start_on_load: true
      theme: base
      security_level: loose
      theme_variables:
        primary_color: '#E3F5E5'
        background: '#E3F5E5'
        line_color: '#B4B8C6'
        primary_border_color: '#008542'
        primary_text_color: '#00381A'
  - require: ./extensions/detect-unused-media-extension.js
    excludepatterns:
      - '*-dark.svg'
      - 'icons/*.svg'
  - require: ./extensions/llms-txt-generator-extension.js
  - require: ./extensions/agents-md-generator-extension.js
  - require: ./extensions/guides-versions-extension.js
    # When Server 5.0 ships and this moves to '5.0', decide what 4.x readers get.
    # One option is to freeze the 4.10 guides as a separate archive site and use
    # the Antora Atlas extension (https://gitlab.com/antora/antora-atlas-extension)
    # so its links to pages it doesn't contain resolve to the live site. Atlas
    # was alpha software when this note was written, so check its status first.
    # Server build is off while the Server conversion is unfinished (DOC-281).
    # Set to true to build it and show the version switcher again.
    enabled: false
    serverversion: '4.10'
    # Earliest Server version the docs cover. Pages available from it get no
    # "Server version" sidebar line.
    serverbaseline: '4.7'
    serverstartpage: getting-started:create-project.adoc
    # The build fails when more xrefs than this point to pages the Server build
    # drops. Lower it as they get wrapped in ifndef::server[] (the list is in
    # extensions/.temp/guides-server-unlinked.md after a build).
    maxunlinkedxrefs: 132
