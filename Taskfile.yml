version: '3'

vars:
  BUCKET: "circleci-docs-platform-assets"
  RESULTS_DIR: test-reports
  TEST_REPORT: test-reports/tests.xml
  LINT_REPORT: test-reports/lint.xml

tasks:
  lint:
    desc: Run `golangci-lint run` to lint the code
    summary: Lint the project with golangci-lint
    vars:
      ARGS: '{{default "./..." .CLI_ARGS}}'
    cmds:
      - go tool golangci-lint run {{.ARGS}}

  lint-migrate:
    desc: Migrate the `golangci-lint` config
    cmds:
      - go tool golangci-lint migrate

  fmt:
    desc: Format the code
    vars:
      ARGS: '{{default "." .CLI_ARGS}}'
    cmds:
      - go tool gosimports -local "$(go list -m)" -w {{.ARGS}}

  test:
    desc: Run the tests
    vars:
      ARGS: '{{default "./..." .CLI_ARGS}}'
    cmds:
      - mkdir -p {{.RESULTS_DIR}}
      - go tool gotestsum -- -race {{.ARGS}}

  generate:
    desc: Run generation of any generated code
    vars:
      ARGS: '{{default "./..." .CLI_ARGS}}'
    cmds:
      - go generate -x {{.ARGS}}

  mod-tidy:
    desc: Run 'go mod tidy' to clean up module files.
    cmds:
      - go mod tidy -v

  mod-download:
    desc: Run 'go mod download' to retrieve module files.
    cmds:
      - go mod download -x

  deploy:
    desc: Deploy to S3 bucket
    cmds:
      - dir=$(mktemp -d);
        cp -r "./build" "${dir}/docs";
        aws s3 sync "${dir}" "s3://{{.BUCKET}}/" --delete;
        rm -rf "${dir}";

  deploy-link-headers:
    desc: Create or update the Link headers CloudFront Function from the build output
    summary: |
      Creates (or updates) and publishes the RFC 8288 Link headers CloudFront Function
      generated by the Antora build.

      The function is written to ./build/cloudfront-link-headers-function.js by the
      link-headers-extension Antora extension. When deployed to CloudFront and associated
      with the docs distribution as a viewer-response function, it adds HTTP Link response
      headers so that AI agents and tools can discover machine-readable resources
      (llms.txt, AGENTS.md, API docs).

      This task creates/updates and publishes the CloudFront function. Associating it
      with the distribution's viewer-response event is a one-time manual step via the
      AWS console or CLI.

      Prerequisites:
        - AWS credentials with cloudfront:CreateFunction, cloudfront:UpdateFunction,
          and cloudfront:PublishFunction permissions
        - The docs site must have been built first (task build)
    cmds:
      - |
        set -e

        FUNCTION_NAME="docs-link-headers"
        FUNCTION_CODE="./build/cloudfront-link-headers-function.js"
        FUNCTION_CONFIG='{"Comment":"RFC 8288 Link headers for agent discoverability","Runtime":"cloudfront-js-2.0"}'

        # Create or update the function
        if aws cloudfront describe-function --name "${FUNCTION_NAME}" > /dev/null 2>&1; then
          ETAG=$(aws cloudfront describe-function --name "${FUNCTION_NAME}" \
            --query 'ETag' --output text)
          aws cloudfront update-function \
            --name "${FUNCTION_NAME}" \
            --function-config "${FUNCTION_CONFIG}" \
            --function-code "fileb://${FUNCTION_CODE}" \
            --if-match "${ETAG}"
          echo "Updated CloudFront function: ${FUNCTION_NAME}"
        else
          aws cloudfront create-function \
            --name "${FUNCTION_NAME}" \
            --function-config "${FUNCTION_CONFIG}" \
            --function-code "fileb://${FUNCTION_CODE}"
          echo "Created CloudFront function: ${FUNCTION_NAME}"
        fi

        # Publish the function so it can be associated with a distribution
        ETAG=$(aws cloudfront describe-function --name "${FUNCTION_NAME}" \
          --query 'ETag' --output text)
        aws cloudfront publish-function \
          --name "${FUNCTION_NAME}" \
          --if-match "${ETAG}"
        echo "Published CloudFront function: ${FUNCTION_NAME}"

  deploy-redirects:
    desc: Build main
    cmds:
      - go run ./cmd/create-redirects {{.BUCKET}}

  validate-redirects:
    desc: Build main
    cmds:
      - go run ./cmd/validate-redirects https://circleci.com

  build:
    desc: Build docs
    cmds:
      - npm run build:docs

  validate-html:
    desc: Validate HTML and internal links (skips external links for speed)
    cmds:
      - go tool htmltest -s

  validate-html-external:
    desc: Validate HTML including external links (slower; used by the daily pipeline)
    cmds:
      - go tool htmltest

  # Tasks for running the service locally

  run-publicapi:
    desc: Run the public API
    cmds:
      - go run ./cmd/publicapi

  run-internalapi:
    desc: Run the internal API
    cmds:
      - go run ./cmd/internalapi

  # Tasks below here are intended mainly to be run as part of CI

  ci:lint:
    desc: Run `golangci-lint run` to lint the code, outputting a report.
    cmds:
      - mkdir -p "{{.RESULTS_DIR}}"
      - task: lint
        vars:
          CLI_ARGS: |
            ./... \
            --output.junit-xml.path "{{.LINT_REPORT}}" --output.junit-xml.extended \
            --output.text.path=stdout --output.text.colors=true

  ci:test:
    desc: Run the tests and output the test results
    vars:
      ARGS: '{{default "./..." .CLI_ARGS}}'
    cmds:
      - mkdir -p {{.RESULTS_DIR}}
      - go tool gotestsum --junitfile="{{.TEST_REPORT}}" -- -race -count=1 {{.ARGS}}

  ci:diff:
    desc: Check no diffs
    cmds:
      - task: generate
      - task: fmt
      - task: mod-tidy
      - git diff --exit-code
