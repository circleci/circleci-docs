extends: script
message: "A CircleCI configuration file can have any name. Do not say it must have this name or assume the reader's file does. Write 'your CircleCI configuration file, commonly stored as `.circleci/config.yml`'."
level: warning
scope: raw
# A script rule reports only the leading phrase. The Docs vocabulary accepts
# `.circleci/config.yml`, so an existence rule matching it would be silenced.
# Two phrasings: a stated requirement ("must be named ..."), and the common
# assumption that the reader has a file with this name ("your ...").
script: |
  text := import("text")
  matches := []

  patterns := [
    "(?i)\\b((?:must be|named|called)(?:\\s+(?:named|called))?)\\s+`?\\.circleci/config\\.yml",
    "(?i)\\b(your)\\s+`?\\.circleci/config\\.yml"
  ]

  for p in patterns {
    found := text.re_find(p, scope, -1)
    if found != undefined {
      for m in found {
        matches = append(matches, {begin: m[1].begin, end: m[1].end})
      }
    }
  }
