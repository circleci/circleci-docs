# manni meta config for DOC-269 (docs metadata schema).
#
# The docs schema hangs off `overrides:` scoped to the `pages` collection,
# rather than top-level `meta.schemas`, so a stray file outside the docs tree
# (e.g. a test fixture) is never judged against our page contract.
#
# Scope: every real Antora page across every component EXCEPT docs/contributors.
# That component is meta-documentation about writing docs (style guide,
# templates) rather than product docs, and its template pages carry
# deliberately illustrative attribute values that aren't real metadata.
collections:
  - name: pages
    paths:
      - "docs/guides/modules/*/pages/**/*.adoc"
      - "docs/reference/modules/*/pages/**/*.adoc"
      - "docs/orbs/modules/*/pages/**/*.adoc"
      - "docs/services/modules/*/pages/**/*.adoc"
      - "docs/root/modules/*/pages/**/*.adoc"
      - "docs/server-admin-4.7/modules/*/pages/**/*.adoc"
      - "docs/server-admin-4.8/modules/*/pages/**/*.adoc"
      - "docs/server-admin-4.9/modules/*/pages/**/*.adoc"
      - "docs/server-admin-4.10/modules/*/pages/**/*.adoc"

meta:
  overrides:
    - collection: pages
      schemas:
        - ./schemas/docs-metadata.schema.json
