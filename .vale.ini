StylesPath = styles

Vocab = Docs

MinAlertLevel = suggestion

# Pinned so an upstream release cannot change rule behavior or add errors
# without a change here. To update, set a newer release tag in the URL.
Packages = https://github.com/ammil-industries/vale-signs-of-ai-writing/releases/download/v0.1.1/signs-of-ai-writing.zip

[asciidoctor]
# attribute = value
#
# where 'YES' enables and 'NO' disables.

[*.adoc]
BasedOnStyles = circleci-docs, Vale, AsciiDoc, signs-of-ai-writing

# planning/ is gitignored scratch space, not published content.
[planning/**]
BasedOnStyles =

# Nav entries mirror page titles, which use sentence case. Each list item is a
# bare link, so the xref title-case and list-punctuation rules do not apply.
[**/nav.adoc]
circleci-docs.XrefTitleCase = NO
circleci-docs.ListPunctuation = NO

# Vale.Terms gives false positives on the ssh command in inline code.
[**/ssh-access-jobs.adoc]
Vale.Terms = NO

[**/hardening-your-cluster.adoc]
# The ingress/egress port tables have no terminating punctuation, which makes
# Vale's sentence segmenter merge them into the preceding intro sentence and
# report a false-positive over-length match.
circleci-docs.SentenceLength = NO
# Server docs still say "trigger a pipeline", so the pipeline terminology rule
# is off here. See the exceptions note in styles/circleci-docs/PipelineRuns.yml.
[docs/server-admin-*/**]
circleci-docs.PipelineRuns = NO
