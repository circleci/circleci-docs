StylesPath = styles

Vocab = Docs

MinAlertLevel = suggestion

Packages = https://github.com/ammil-industries/vale-signs-of-ai-writing/releases/latest/download/signs-of-ai-writing.zip

[asciidoctor]
# attribute = value
#
# where 'YES' enables and 'NO' disables.

[*.adoc]
BasedOnStyles = circleci-docs, Vale, AsciiDoc, signs-of-ai-writing

[planning/**]
BasedOnStyles =

[**/nav.adoc]
circleci-docs.XrefTitleCase = NO
circleci-docs.ListPunctuation = NO

[**/ssh-access-jobs.adoc]
Vale.Terms = NO

[**/hardening-your-cluster.adoc]
# The ingress/egress port tables have no terminating punctuation, which makes
# Vale's sentence segmenter merge them into the preceding intro sentence and
# report a false-positive over-length match.
circleci-docs.SentenceLength = NO